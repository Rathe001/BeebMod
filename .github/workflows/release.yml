# Packages the addon and publishes it when a version tag is pushed
# (v0.1.0-beta.2 and so on; scripts/cut-release.ps1 makes one). The same
# checks as the Tests workflow run first, so nothing red is ever packaged.
#
# Where it goes:
#   GitHub Releases   always - the zip, with this version's notes
#   CurseForge        project 1711982, from the X-Curse-Project-ID line in
#                     BeebMod.toc, signed in with the CF_API_KEY secret
#
# A tag with "beta" in it is published as a beta file, "alpha" as an alpha.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lua
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.4

      - name: Tests
        run: |
          set -e
          lua5.4 tests/run.lua
          lua5.4 tests/load.lua

      # the tag and the TOC must agree, or the zip says one version and the
      # addon list another
      - name: The tag matches the TOC
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          toc="$(sed -n 's/^## Version: *//p' BeebMod.toc | tr -d '\r')"
          if [ "$tag" != "$toc" ]; then
            echo "tag $tag but BeebMod.toc says $toc"
            exit 1
          fi

      # CurseForge's "What's New" shows the whole changelog file, so it is
      # handed only this version's section: the first `## ` block.
      - name: This release's notes
        run: awk '/^## /{c++} c==1' CHANGELOG.md > .release-notes.md

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      # WOWUP KNOWS NO WOW: FOREVER (Josh 2026-09-27: installing from the
      # GitHub link worked, updating did not). WowUp takes a Forever install
      # for a MoP Classic beta one and looks in release.json for a zip marked
      # "mists"; the packager rightly marks ours "forever", so WowUp's update
      # found nothing. The same zip is listed for "mists" as well - on the
      # GitHub release only; CurseForge and the game are untouched.
      - name: Let WowUp find the zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release download "$GITHUB_REF_NAME" -p release.json -O release.json --clobber
          jq -c '.releases[].metadata |= (if any(.[]; .flavor == "mists") then . else . + [{flavor: "mists", interface: .[0].interface}] end)' release.json > patched.json
          cat patched.json
          mv patched.json release.json
          gh release upload "$GITHUB_REF_NAME" release.json --clobber
