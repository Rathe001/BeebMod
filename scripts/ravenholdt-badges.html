<!doctype html>
<!-- scripts/ravenholdt-badges.html (Josh 2026-10-05): the Ravenholdt Ledger's
ten rank badges, drawn as in the mockup they were chosen from. The shield, the
metals, the light and the ribbon are the Expedition's (scripts/rank-badges.html),
so the two journals' ranks read as a pair; the marks and what sits round the
shield are a spy's: wings where the Expedition has tusks, a perched raven
where it has antlers, daggers where it has spears and rifles.
scripts/make-badges.py draws the ten in a row and cuts them into
Art/Ravenholdt/rank1.tga to rank10.tga.

Change a badge here, then run the script again. -->
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  #row { display: flex; }
  #row div { width: 256px; height: 256px; }
</style></head>
<body><div id="row"></div>
<script>
(function () {
  "use strict";
  const RANKS = [
    [0, "Fledgling"], [50, "Lookout"], [150, "Eavesdropper"], [300, "Informant"], [500, "Shadow"],
    [800, "Agent"], [1200, "Handler"], [1800, "Spymaster"], [2600, "Master of Shadows"], [3600, "Eye of Ravenholdt"],
  ];
  const METAL = {
    leather: ["#9b7250", "#5e4230", "#3a281b"],
    iron:    ["#b9c2c6", "#6f797e", "#353c40"],
    bronze:  ["#f0b479", "#a86c3a", "#4e2e15"],
    silver:  ["#f4f8fb", "#a9b4bf", "#4f5963"],
    gold:    ["#fff0a8", "#d49c2c", "#6a4610"],
  };
  // NEUTRAL GROUNDS (Josh 2026-10-05: "We use a bit too much blue, which
  // reads as Alliance"): warm ash, then charcoal, then plum, with no blue in
  // any of them
  const FIELD = {
    ash:      ["#5e5850", "#25221e"],
    charcoal: ["#43403f", "#151414"],
    plum:     ["#55304a", "#1c0e18"],
    violet:   ["#523180", "#1d0f33"],
    raven:    ["#2e2b2c", "#0b0a0b"],
  };
  const SPEC = [
    { metal: "leather", field: "ash",      mark: "feather", stitch: true },
    { metal: "leather", field: "ash",      mark: "spyglass", stitch: true },
    { metal: "iron",    field: "ash",      mark: "keyhole" },
    { metal: "iron",    field: "charcoal", mark: "letter" },
    { metal: "bronze",  field: "charcoal", mark: "mask" },
    { metal: "bronze",  field: "plum",     mark: "dagger", daggers: true },
    { metal: "silver",  field: "plum",     mark: "key", wings: true },
    { metal: "gold",    field: "plum",     mark: "eye", wings: true, raven: true },
    { metal: "gold",    field: "violet",   mark: "amethyst", wings: true, raven: true, ribbon: true },
    { metal: "gold",    field: "raven",    mark: "ruby", wings: true, raven: true, ribbon: true, daggers: true, glow: true, plumage: true },
  ];

  const SHIELD = "M60 14 C74 14 86 17 95 22 L95 58 C95 80 81 96 60 109 C39 96 25 80 25 58 L25 22 C34 17 46 14 60 14 Z";
  const around = (s) => `translate(60 61) scale(${s}) translate(-60 -61)`;
  const SHADE = "#00000066";
  let uid = 0;

  // A CUT STONE (Josh 2026-10-05: "it looks like a cube in the emblem"): a
  // flat top, a slanted crown, a point below, the left facets lit
  function gem(id, c, fill) {
    return `<defs><linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="${c[0]}"/><stop offset=".5" stop-color="${c[1]}"/><stop offset="1" stop-color="${c[2]}"/></linearGradient></defs>
      <polygon points="50,39 70,39 82,51 60,83 38,51" fill="url(#g${id})" stroke="${fill}" stroke-width="2.5" stroke-linejoin="round"/>
      <polygon points="50,39 60,51 70,39" fill="#ffffff" opacity=".22"/>
      <polygon points="38,51 50,39 47,51" fill="#ffffff" opacity=".32"/>
      <polygon points="47,51 60,51 60,83" fill="#ffffff" opacity=".10"/>
      <polygon points="60,51 82,51 60,83" fill="#000000" opacity=".22"/>
      <path d="M38 51 H82 M50 39 L47 51 L60 83 M70 39 L73 51 L60 83 M50 39 L60 51 L70 39 M60 51 V83" fill="none" stroke="#ffffff" stroke-opacity=".38" stroke-width="1" stroke-linejoin="round"/>
      <path d="M47 41.5 L48.3 44.7 L51.5 46 L48.3 47.3 L47 50.5 L45.7 47.3 L42.5 46 L45.7 44.7 Z" fill="#ffffff" opacity=".9"/>`;
  }

  function mark(kind, fill, id) {
    switch (kind) {
      // FLEDGLING: one raven feather
      case "feather": return `<path d="M42 88 C42 66 56 44 82 30 C82 54 66 76 42 88 Z" fill="${fill}"/>
          <path d="M42 88 L80 33" stroke="${SHADE}" stroke-width="2.2"/>
          <path d="M55 70 L49 67 M62 61 L56 57 M69 51 L64 47 M60 74 L67 74 M67 65 L74 64" stroke="${SHADE}" stroke-width="1.8" stroke-linecap="round"/>`;
      // LOOKOUT: a spyglass
      case "spyglass": return `<g transform="rotate(-36 60 59)">
          <rect x="32" y="54" width="18" height="10" rx="2" fill="${fill}"/>
          <rect x="49" y="51.5" width="18" height="15" rx="2" fill="${fill}"/>
          <rect x="66" y="48.5" width="22" height="21" rx="2.5" fill="${fill}"/>
          <path d="M50 51.5 V66.5 M67 48.5 V69.5" stroke="${SHADE}" stroke-width="2.4"/></g>`;
      // EAVESDROPPER: a keyhole
      case "keyhole": return `<circle cx="60" cy="50" r="12" fill="${fill}"/>
          <path d="M52.5 56 L67.5 56 L72 84 L48 84 Z" fill="${fill}"/>`;
      // INFORMANT: a sealed letter
      case "letter": return `<rect x="35" y="43" width="50" height="34" rx="2.5" fill="${fill}"/>
          <path d="M35.5 45 L60 64 L84.5 45" fill="none" stroke="${SHADE}" stroke-width="2.6"/>
          <circle cx="60" cy="64" r="7" fill="#a8322b" stroke="#4a1210" stroke-width="1.4"/>`;
      // SHADOW: a rogue's mask
      case "mask": return `<path d="M33 56 C27 58 24 63 26 68 M87 56 C93 58 96 63 94 68" fill="none" stroke="${fill}" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M32 52 C38 42 52 42 60 49 C68 42 82 42 88 52 C90 65 80 73 70 71 C65 70 62 66 60 62 C58 66 55 70 50 71 C40 73 30 65 32 52 Z" fill="${fill}"/>
          <path d="M40 56 C43 50 52 50 55 56 C52 61 43 61 40 56 Z M65 56 C68 50 77 50 80 56 C77 61 68 61 65 56 Z" fill="#0d0b0c"/>`;
      // AGENT: a dagger
      case "dagger": return `<path d="M60 31 L65.5 44 L64.5 70 L55.5 70 L54.5 44 Z" fill="${fill}"/>
          <path d="M60 39 V66" stroke="${SHADE}" stroke-width="1.8"/>
          <rect x="45" y="69" width="30" height="5.5" rx="2.5" fill="${fill}"/>
          <rect x="57" y="74" width="6" height="11" fill="${fill}" opacity=".8"/>
          <circle cx="60" cy="88" r="4" fill="${fill}"/>`;
      // HANDLER: a key
      case "key": return `<circle cx="60" cy="44" r="9.5" fill="none" stroke="${fill}" stroke-width="5.5"/>
          <rect x="57" y="52" width="6" height="34" fill="${fill}"/>
          <rect x="62" y="72" width="9" height="5" fill="${fill}"/><rect x="62" y="80" width="7" height="5" fill="${fill}"/>`;
      // SPYMASTER: the open eye
      case "eye": return `<path d="M32 59 Q60 34 88 59 Q60 84 32 59 Z" fill="${fill}"/>
          <circle cx="60" cy="59" r="11" fill="#2a1f4a"/><circle cx="60" cy="59" r="5" fill="#08060e"/>
          <circle cx="63.5" cy="55.5" r="2.4" fill="#ffffffcc"/>`;
      case "amethyst": return gem(id, ["#efd9ff", "#8a4fd0", "#2e1052"], fill);
      case "ruby": return gem(id, ["#ffc2c6", "#d42a40", "#5a0a16"], fill);
    }
    return "";
  }

  function badge(i) {
    const s = SPEC[i], m = METAL[s.metal], f = FIELD[s.field], id = "b" + (uid++);
    const markFill = s.metal === "leather" ? "#e3c79e" : m[0];
    const parts = [];
    parts.push(`<defs>
      <linearGradient id="r${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${m[0]}"/><stop offset=".45" stop-color="${m[1]}"/><stop offset="1" stop-color="${m[2]}"/></linearGradient>
      <radialGradient id="f${id}" cx=".5" cy=".35" r=".75"><stop offset="0" stop-color="${f[0]}"/><stop offset="1" stop-color="${f[1]}"/></radialGradient>
      <radialGradient id="w${id}" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd76a" stop-opacity=".5"/><stop offset=".6" stop-color="#9a6bff" stop-opacity=".2"/><stop offset="1" stop-color="#9a6bff" stop-opacity="0"/></radialGradient>
      <clipPath id="c${id}"><path d="${SHIELD}" transform="${around(.84)}"/></clipPath>
    </defs>`);
    if (s.glow) parts.push(`<circle cx="60" cy="58" r="72" fill="url(#w${id})"/>`);
    // two daggers crossed behind, where the Expedition has spears and rifles
    if (s.daggers) {
      for (const flip of [1, -1]) {
        parts.push(`<g transform="translate(60 0) scale(${flip} 1) translate(-60 0)">
          <path d="M36 88 L100 4 L105 9 L41 92 Z" fill="#e3e9ec" stroke="#4a5458" stroke-width="1.2"/>
          <path d="M30 83 L46 97" stroke="${m[1]}" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M37 92 L24 108" stroke="#2a1d14" stroke-width="5.5" stroke-linecap="round"/>
          <circle cx="22" cy="110" r="3.5" fill="${m[1]}"/></g>`);
      }
    }
    // a raven's wings either side, where the Expedition has tusks
    if (s.wings) {
      for (const flip of [1, -1]) {
        parts.push(`<path transform="translate(60 0) scale(${flip} 1) translate(-60 0)"
          d="M31 36 C17 30 4 34 -6 46 C3 47 9 50 13 54 C3 57 -2 64 -5 73 C5 69 12 69 17 71 C9 77 6 85 6 93 C15 85 24 80 31 77 Z"
          fill="#262324" stroke="${m[1]}" stroke-width="1.6" stroke-linejoin="round"/>`);
      }
    }
    parts.push(`<path d="${SHIELD}" fill="url(#r${id})" stroke="${m[2]}" stroke-width="2"/>`);
    parts.push(`<path d="${SHIELD}" transform="${around(.84)}" fill="url(#f${id})" stroke="${m[2]}" stroke-width="1.5"/>`);
    if (s.plumage) {
      parts.push(`<g clip-path="url(#c${id})" fill="none" stroke="#5a5254" stroke-opacity=".55" stroke-width="1.6">
        <path d="M28 34 Q40 40 46 30"/><path d="M92 34 Q80 40 74 30"/><path d="M26 56 Q38 62 44 52"/><path d="M94 56 Q82 62 76 52"/>
        <path d="M32 80 Q44 84 48 74"/><path d="M88 80 Q76 84 72 74"/></g>`);
    }
    if (s.stitch) {
      parts.push(`<path d="${SHIELD}" transform="${around(.76)}" fill="none" stroke="#e3c79e" stroke-opacity=".6" stroke-width="1.4" stroke-dasharray="3.5 3"/>`);
    }
    parts.push(`<path d="${SHIELD}" transform="${around(.84)}" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="1" />`);
    parts.push(`<g>${mark(s.mark, markFill, id)}</g>`);
    parts.push(`<path clip-path="url(#c${id})" d="M20 14 H100 V40 Q60 30 20 44 Z" fill="#ffffff" opacity=".07"/>`);
    // a raven perched on the shield, where the Expedition has antlers
    if (s.raven) {
      parts.push(`<g transform="translate(52 0)">
        <path d="M-20 18 C-16 6 -6 -2 6 -1 C9 -10 18 -12 23 -7 L33 -5 L23 -1 C24 8 17 15 6 17 L-6 17 Z"
          fill="#151314" stroke="${m[1]}" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M-4 6 C2 2 10 3 14 8" fill="none" stroke="#3a3436" stroke-width="1.6"/>
        <circle cx="17" cy="-6" r="1.8" fill="#ffd24d"/>
        <path d="M2 17 V21 M9 17 V21" stroke="${m[1]}" stroke-width="2" stroke-linecap="round"/></g>`);
    }
    if (s.ribbon) {
      parts.push(`<path d="M14 94 L26 90 L22 100 L26 110 L14 106 Z M106 94 L94 90 L98 100 L94 110 L106 106 Z" fill="#2e1a4c"/>
        <path d="M24 88 Q60 98 96 88 L96 104 Q60 114 24 104 Z" fill="#4e2e7c" stroke="#1a0c30" stroke-width="1.5"/>
        <path d="M28 93 Q60 102 92 93" fill="none" stroke="#ffd98a" stroke-opacity=".6" stroke-width="1" stroke-dasharray="2 2.5"/>`);
    }
    return `<svg viewBox="-12 -16 144 144" role="img" aria-label="${RANKS[i][1]} badge" width="100%" height="100%">${parts.join("")}</svg>`;
  }

  const row = document.getElementById("row");
  RANKS.forEach((_, i) => {
    const cell = document.createElement("div");
    cell.innerHTML = badge(i);
    row.appendChild(cell);
  });
})();
</script></body></html>
