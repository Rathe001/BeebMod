<!doctype html>
<!-- scripts/rank-badges.html (Josh 2026-09-29): the Expedition's ten rank
badges, drawn as in the mockup the art was chosen from. scripts/make-badges.py
opens this in headless Edge, which draws the ten in a row on a clear ground,
and cuts the picture into Art/Ranks/rank1.tga to rank10.tga - and then the
three pieces of the dock's other shields, into Art/Dock.

Change a badge here, then run the script again. -->
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  #row { display: flex; }
  #row div { width: 256px; height: 256px; }
</style></head>
<body><div id="row"></div>
<script>
(function () {
  "use strict";
  const RANKS = [
    [0, "Greenhorn"], [50, "Tracker"], [150, "Trapper"], [300, "Stalker"], [500, "Pathfinder"],
    [800, "Huntsman"], [1200, "Big-Game Hunter"], [1800, "Trophy Hunter"], [2600, "Master of the Hunt"],
    [3600, "Expedition Leader"],
  ];

  // what each rank is made of
  const METAL = {
    leather: ["#9b7250", "#5e4230", "#3a281b"],
    iron:    ["#b9c2c6", "#6f797e", "#353c40"],
    bronze:  ["#f0b479", "#a86c3a", "#4e2e15"],
    silver:  ["#f4f8fb", "#a9b4bf", "#4f5963"],
    gold:    ["#fff0a8", "#d49c2c", "#6a4610"],
  };
  const FIELD = {
    rawhide: ["#6a4f37", "#3b2a1d"],
    jungle:  ["#356b50", "#16301f"],
    night:   ["#343b78", "#141734"],
    tiger:   ["#d9822e", "#7a3b10"],
  };
  const SPEC = [
    { metal: "leather", field: "rawhide", mark: "paw",     stitch: true, adds: "Rawhide, stitched, one paw print" },
    { metal: "leather", field: "rawhide", mark: "track",   stitch: true, adds: "A bird's track" },
    { metal: "iron",    field: "rawhide", mark: "trap",    adds: "An iron rim and a steel trap" },
    { metal: "iron",    field: "jungle",  mark: "sight",   adds: "Jungle green and a rifle sight" },
    { metal: "bronze",  field: "jungle",  mark: "compass", adds: "Bronze and a compass star" },
    { metal: "bronze",  field: "jungle",  mark: "arrow",   spears: true, adds: "Crossed spears behind" },
    { metal: "silver",  field: "jungle",  mark: "claw",    tusks: true, adds: "Silver, and tusks in place of the spears" },
    { metal: "gold",    field: "jungle",  mark: "claw",    tusks: true, antlers: true, adds: "Gold, and antlers above" },
    { metal: "gold",    field: "night",   mark: "amber",   tusks: true, antlers: true, ribbon: true, adds: "Night blue, an amber stone and a ribbon" },
    { metal: "gold",    field: "tiger",   mark: "jade",    tusks: true, antlers: true, ribbon: true, rifles: true, glow: true,
      adds: "Tiger stripes, jade, and Nesingwary's crossed rifles" },
  ];

  const SHIELD = "M60 14 C74 14 86 17 95 22 L95 58 C95 80 81 96 60 109 C39 96 25 80 25 58 L25 22 C34 17 46 14 60 14 Z";
  const around = (s) => `translate(60 61) scale(${s}) translate(-60 -61)`;
  let uid = 0;

  function paw(x, y, s, fill) {
    return `<g transform="translate(${x} ${y}) scale(${s})" fill="${fill}">
      <ellipse cx="0" cy="7" rx="9" ry="7.5"/>
      <ellipse cx="-11" cy="-5" rx="3.6" ry="4.4" transform="rotate(-20 -11 -5)"/>
      <ellipse cx="-4.5" cy="-11" rx="3.8" ry="4.8"/>
      <ellipse cx="4.5" cy="-11" rx="3.8" ry="4.8"/>
      <ellipse cx="11" cy="-5" rx="3.6" ry="4.4" transform="rotate(20 11 -5)"/></g>`;
  }

  function mark(kind, fill, id) {
    switch (kind) {
      case "paw": return paw(60, 58, 1.15, fill);
      // TRACKER: ONE BIRD TRACK (Josh 2026-09-29: "The 3 paws shield doesn't
      // read very well when very small"): three thick toes from a heel, the
      // sign a tracker reads in mud - bold enough for the dock's 17 pixels
      case "track": return `<g fill="none" stroke="${fill}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M60 78 L60 40"/><path d="M60 70 L42 46"/><path d="M60 70 L78 46"/>
          <path d="M60 78 L60 86"/></g>`;
      case "trap": return `<g fill="none" stroke="${fill}" stroke-linecap="round">
          <path d="M38 60 A22 18 0 0 0 82 60" stroke-width="4"/>
          <path d="M38 60 A22 18 0 0 1 82 60" stroke-width="4"/>
          <path d="M60 79 V84" stroke-width="2.4"/><ellipse cx="60" cy="88" rx="2.6" ry="3.6" stroke-width="2.2"/>
          <path d="M38 60 H29 M82 60 H91" stroke-width="3.2"/><path d="M29 55 V65 M91 55 V65" stroke-width="3"/></g>
          <path fill="${fill}" d="M43.4 72.9 L48.6 72.9 L46.0 65.9 Z M50.4 76.1 L55.6 76.1 L53.0 69.1 Z M57.4 77.0 L62.6 77.0 L60.0 70.0 Z M64.4 76.1 L69.6 76.1 L67.0 69.1 Z M71.4 72.9 L76.6 72.9 L74.0 65.9 Z M46.9 45.2 L52.1 45.2 L49.5 52.2 Z M53.9 43.2 L59.1 43.2 L56.5 50.2 Z M60.9 43.2 L66.1 43.2 L63.5 50.2 Z M67.9 45.2 L73.1 45.2 L70.5 52.2 Z"/>
          <circle cx="38" cy="60" r="4.2" fill="${fill}"/><circle cx="82" cy="60" r="4.2" fill="${fill}"/>
          <circle cx="60" cy="60" r="4.5" fill="${fill}" opacity=".8"/>`;
      case "sight": return `<g fill="none" stroke="${fill}" stroke-width="3.2" stroke-linecap="round">
          <circle cx="60" cy="59" r="15"/><path d="M60 38 V48 M60 70 V80 M39 59 H49 M71 59 H81"/></g>
          <circle cx="60" cy="59" r="3.4" fill="${fill}"/>`;
      case "compass": return `<path fill="${fill}" d="M60 36 L65.5 53.5 L83 59 L65.5 64.5 L60 82 L54.5 64.5 L37 59 L54.5 53.5 Z"/>
          <path fill="${fill}" opacity=".55" d="M60 59 L72 47 L66 61 Z M60 59 L48 71 L54 57 Z M60 59 L72 71 L58 65 Z M60 59 L48 47 L62 53 Z"/>
          <circle cx="60" cy="59" r="3" fill="#00000055"/>`;
      case "arrow": return `<g fill="${fill}"><path d="M60 34 L69 50 L63 48 L63 74 L57 74 L57 48 L51 50 Z"/>
          <path d="M57 72 L50 84 L57 81 Z M63 72 L70 84 L63 81 Z M58.5 74 H61.5 V86 H58.5 Z"/></g>`;
      case "claw": return `<g fill="none" stroke="${fill}" stroke-width="5" stroke-linecap="round">
          <path d="M47 40 Q54 58 46 80"/><path d="M60 37 Q66 58 59 83"/><path d="M73 40 Q79 58 72 80"/></g>`;
      case "amber":
      case "jade": {
        const c = kind === "amber" ? ["#ffe29a", "#e08a1e", "#7a3a06"] : ["#b9ffd9", "#2fae74", "#0b4a2e"];
        return `<defs><linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="${c[0]}"/><stop offset=".55" stop-color="${c[1]}"/><stop offset="1" stop-color="${c[2]}"/></linearGradient></defs>
          <polygon points="60,37 76,48 76,68 60,81 44,68 44,48" fill="url(#g${id})" stroke="${fill}" stroke-width="2.5"/>
          <polyline points="44,48 60,56 76,48" fill="none" stroke="#ffffff66" stroke-width="1.2"/>
          <path d="M60 56 V81 M44 68 L60 56 L76 68" stroke="#00000033" stroke-width="1.2" fill="none"/>
          <path d="M50 46 L57 42 L55 50 Z" fill="#ffffffaa"/>`;
      }
    }
    return "";
  }

  function badge(i) {
    const s = SPEC[i], m = METAL[s.metal], f = FIELD[s.field], id = "b" + (uid++);
    const markFill = s.metal === "leather" ? "#e3c79e" : m[0];
    const parts = [];
    parts.push(`<defs>
      <linearGradient id="r${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${m[0]}"/><stop offset=".45" stop-color="${m[1]}"/><stop offset="1" stop-color="${m[2]}"/></linearGradient>
      <radialGradient id="f${id}" cx=".5" cy=".35" r=".75"><stop offset="0" stop-color="${f[0]}"/><stop offset="1" stop-color="${f[1]}"/></radialGradient>
      <linearGradient id="i${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff9e6"/><stop offset="1" stop-color="#cdbb8f"/></linearGradient>
      <radialGradient id="w${id}" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd76a" stop-opacity=".55"/><stop offset=".6" stop-color="#2fae74" stop-opacity=".18"/><stop offset="1" stop-color="#2fae74" stop-opacity="0"/></radialGradient>
      <clipPath id="c${id}"><path d="${SHIELD}" transform="${around(.84)}"/></clipPath>
    </defs>`);
    if (s.glow) parts.push(`<circle cx="60" cy="58" r="72" fill="url(#w${id})"/>`);
    if (s.rifles) {
      for (const flip of [1, -1]) {
        parts.push(`<g transform="translate(60 0) scale(${flip} 1) translate(-60 0)">
          <path d="M12 116 L22 104 L30 110 L20 122 Z" fill="#6b4222" stroke="#2c1a0c" stroke-width="1.5"/>
          <path d="M24 104 L102 8" stroke="#6b4222" stroke-width="6" stroke-linecap="round"/>
          <path d="M56 65 L106 3" stroke="#5a6468" stroke-width="3" stroke-linecap="round"/></g>`);
      }
    }
    if (s.spears) {
      for (const flip of [1, -1]) {
        parts.push(`<g transform="translate(60 0) scale(${flip} 1) translate(-60 0)">
          <path d="M20 112 L98 16" stroke="#7b5634" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M98 16 L104 -2 L108 2 Z M98 16 L94 12 L110 -4 L104 16 Z" fill="${m[0]}" stroke="${m[2]}" stroke-width="1"/></g>`);
      }
    }
    if (s.tusks) {
      for (const flip of [1, -1]) {
        parts.push(`<path transform="translate(60 0) scale(${flip} 1) translate(-60 0)"
          d="M28 78 C8 72 2 48 12 28 C13 44 19 60 32 66 Z" fill="url(#i${id})" stroke="#6e6146" stroke-width="1.5"/>`);
      }
    }
    if (s.antlers) {
      for (const flip of [1, -1]) {
        parts.push(`<g transform="translate(60 0) scale(${flip} 1) translate(-60 0)" fill="none" stroke="${m[1]}" stroke-width="4" stroke-linecap="round">
          <path d="M50 20 C44 8 38 0 26 -6"/><path d="M44 10 C42 3 43 -3 46 -9"/><path d="M37 2 C33 -4 33 -9 35 -14"/><path d="M40 6 C33 5 27 6 22 10"/></g>`);
      }
    }
    // the shield: rim, field, a light across the top
    parts.push(`<path d="${SHIELD}" fill="url(#r${id})" stroke="${m[2]}" stroke-width="2"/>`);
    parts.push(`<path d="${SHIELD}" transform="${around(.84)}" fill="url(#f${id})" stroke="${m[2]}" stroke-width="1.5"/>`);
    if (s.field === "tiger") {
      parts.push(`<g clip-path="url(#c${id})" fill="#2a1406" opacity=".85">
        <path d="M22 30 Q40 34 44 26 Q38 40 22 40 Z"/><path d="M98 30 Q80 34 76 26 Q82 40 98 40 Z"/>
        <path d="M22 56 Q38 58 42 50 Q38 64 22 66 Z"/><path d="M98 56 Q82 58 78 50 Q82 64 98 66 Z"/>
        <path d="M30 82 Q44 80 46 72 Q46 88 34 92 Z"/><path d="M90 82 Q76 80 74 72 Q74 88 86 92 Z"/>
        <path d="M54 20 Q60 30 66 20 Q62 34 60 36 Q58 34 54 20 Z"/></g>`);
    }
    if (s.stitch) {
      parts.push(`<path d="${SHIELD}" transform="${around(.76)}" fill="none" stroke="#e3c79e" stroke-opacity=".6" stroke-width="1.4" stroke-dasharray="3.5 3"/>`);
    }
    parts.push(`<path d="${SHIELD}" transform="${around(.84)}" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="1" />`);
    parts.push(`<g>${mark(s.mark, markFill, id)}</g>`);
    parts.push(`<path clip-path="url(#c${id})" d="M20 14 H100 V40 Q60 30 20 44 Z" fill="#ffffff" opacity=".07"/>`);
    if (s.ribbon) {
      parts.push(`<path d="M14 94 L26 90 L22 100 L26 110 L14 106 Z M106 94 L94 90 L98 100 L94 110 L106 106 Z" fill="#6e1f1b"/>
        <path d="M24 88 Q60 98 96 88 L96 104 Q60 114 24 104 Z" fill="#a8322b" stroke="#4a1210" stroke-width="1.5"/>
        <path d="M28 93 Q60 102 92 93" fill="none" stroke="#ffd98a" stroke-opacity=".6" stroke-width="1" stroke-dasharray="2 2.5"/>`);
    }
    return `<svg viewBox="-12 -16 144 144" role="img" aria-label="${RANKS[i][1]} badge" width="100%" height="100%">${parts.join("")}</svg>`;
  }

  // THE DOCK'S OTHER SHIELDS (Josh 2026-09-29): the Level and reputation
  // lines wear a shield like the Expedition's badge, so the three line up.
  // Each is in layers the client puts together: a white field it tints (the
  // Experience colour, or the standing's), a steel rim over it, and a banner
  // for reputation - the level is the client's own text.
  // light, middle and shadow of each level bracket's rim
  const LEVEL_RIMS = {
    level1: ["#7a7a7a", "#484848", "#1c1c1c"],  // 1-9, poor: dark, well apart from 10-19
    level2: ["#ffffff", "#dfe4ea", "#454b53"],  // 10-19, common: bright, with the same dark edge as the others
    level3: ["#b6ff9e", "#2fbf20", "#0f4a0a"],  // 20-29, uncommon
    level4: ["#9fd0ff", "#1f78d6", "#0b2f5c"],  // 30-39, rare
    level5: ["#e3b8ff", "#9a3fe0", "#3d145e"],  // 40-49, epic
    level6: ["#ffd19a", "#f07f10", "#6a3004"],  // 50-59, legendary
    level7: ["#fff3cc", "#e2c275", "#6b5421"],  // 60, artifact, crowned
  };

  function piece(kind) {
    const m = METAL.iron, id = "p" + (uid++);
    const svg = (inner) => `<svg viewBox="-12 -16 144 144" width="100%" height="100%">${inner}</svg>`;
    if (kind === "field") {
      return svg(`<defs><radialGradient id="f${id}" cx=".5" cy=".3" r=".8">
          <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#7a7a7a"/></radialGradient></defs>
        <path d="${SHIELD}" transform="${around(.84)}" fill="url(#f${id})"/>`);
    }
    if (kind === "rim" || kind.startsWith("level")) {
      // THE LEVEL'S RIM (Josh 2026-09-29: ten-level brackets, "1-9, 10-19 ...
      // 60"): the item quality colours, poor grey to artifact gold, each
      // bracket its own; the plain rim is steel
      const m = LEVEL_RIMS[kind] || METAL.iron;
      // 60: A CROWNED SHIELD (Josh 2026-09-29: "The 60 gem is not readable.
      // Instead, can we add some embellishments to the shield border?"). A
      // pixel in the dock is four units here, so everything is bold: a crown
      // of three points on the top edge (the Level line draws this shield
      // with a taller crop, so the crown shows), a heavy second gold line
      // inside the rim, and four large rivets.
      const gem = kind === "level7"
        ? `<path d="${SHIELD}" transform="${around(.76)}" fill="none" stroke="#6b5421" stroke-width="7"/>
           <path d="${SHIELD}" transform="${around(.76)}" fill="none" stroke="#f6dc8e" stroke-width="4.5"/>
           ${[[30, 30], [90, 30], [34, 74], [86, 74]].map(([x, y]) =>
             `<circle cx="${x}" cy="${y}" r="5" fill="#fff4cf" stroke="#5a4418" stroke-width="2"/>`).join("")}
           <path d="M38 18 L40 2 L50 11 L60 -2 L70 11 L80 2 L82 18 Q60 11 38 18 Z"
             fill="#f2cf6e" stroke="#5a4418" stroke-width="3" stroke-linejoin="round"/>
           <circle cx="60" cy="-2" r="4" fill="#fff4cf" stroke="#5a4418" stroke-width="2"/>
           <circle cx="40" cy="2" r="3" fill="#fff4cf" stroke="#5a4418" stroke-width="1.6"/>
           <circle cx="80" cy="2" r="3" fill="#fff4cf" stroke="#5a4418" stroke-width="1.6"/>`
        : "";
      return svg(`<defs>
          <linearGradient id="r${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${m[0]}"/><stop offset=".45" stop-color="${m[1]}"/><stop offset="1" stop-color="${m[2]}"/></linearGradient>
          <mask id="m${id}"><rect x="-12" y="-16" width="144" height="144" fill="#fff"/>
            <path d="${SHIELD}" transform="${around(.84)}" fill="#000"/></mask>
          <clipPath id="c${id}"><path d="${SHIELD}" transform="${around(.84)}"/></clipPath></defs>
        <path d="${SHIELD}" fill="url(#r${id})" stroke="${m[2]}" stroke-width="2" mask="url(#m${id})"/>
        <path d="${SHIELD}" transform="${around(.84)}" fill="none" stroke="${m[2]}" stroke-width="1.5"/>
        <path d="${SHIELD}" transform="${around(.84)}" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="1"/>
        <path clip-path="url(#c${id})" d="M20 14 H100 V40 Q60 30 20 44 Z" fill="#ffffff" opacity=".10"/>${gem}`);
    }
    // two swords crossed: PvP, before the first rank
    if (kind === "swords") {
      const sword = `<g stroke="#2b3134" stroke-width="1.5" stroke-linejoin="round">
          <path d="M43 80 L77 38 L81 34 L80 40 L46 83 Z" fill="#e6ecef"/>
          <path d="M38 72 L52 86" stroke="#e6ecef" stroke-width="5" stroke-linecap="round"/>
          <path d="M44 82 L36 92" stroke="#b08a5a" stroke-width="5" stroke-linecap="round"/></g>
          <circle cx="35" cy="93" r="3.4" fill="#e6ecef"/>`;
      return svg(sword + `<g transform="translate(120 0) scale(-1 1)">${sword}</g>`);
    }
    // a banner on its pole: reputation
    return svg(`<g stroke="#2b3134" stroke-width="2" stroke-linejoin="round">
        <path d="M44 34 V88" stroke="#e6ecef" stroke-width="5" stroke-linecap="round"/>
        <path d="M46 36 L80 42 L70 52 L80 62 L46 60 Z" fill="#e6ecef"/></g>
        <circle cx="44" cy="32" r="4" fill="#e6ecef"/>`);
  }

  const row = document.getElementById("row");
  const cells = RANKS.map((_, i) => badge(i)).concat([piece("field"), piece("rim"), piece("banner"), piece("swords")])
    .concat([1, 2, 3, 4, 5, 6, 7].map((n) => piece("level" + n)));
  cells.forEach((html) => {
    const cell = document.createElement("div");
    cell.innerHTML = html;
    row.appendChild(cell);
  });
})();
</script></body></html>
